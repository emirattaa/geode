name: Build & Release
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Android32, os: ubuntu-latest, target: Android32 }
          - { name: Android64, os: ubuntu-latest, target: Android64 }
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          sdk: v5.11.2
          target: ${{ matrix.config.target }}

  package:
    name: Package & Release
    runs-on: ubuntu-latest
    needs: ["build"]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
      - name: Read mod version
        id: ver
        run: echo "version=$(jq -r .version mod.json)" >> "$GITHUB_OUTPUT"
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Cube Autoplay ${{ steps.ver.outputs.version }}
          body: "Geode v5.11.2 / GD 2.2081 için derlendi. .geode dosyasını mods klasörüne at."
          files: ${{ steps.build.outputs.build-output }}/*.geode
