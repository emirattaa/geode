name: Build Geode Mod

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}
          combine: true

  package:
    name: Package Mod
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine Artifacts
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-package
          path: ${{ steps.build.outputs.build-output }}
