name: Build Geode Mod

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: win

          - name: Android 32-bit
            os: ubuntu-latest
            target: android32

          - name: Android 64-bit
            os: ubuntu-latest
            target: android64

    steps:
      - name: Repository'yi Klonla
        uses: actions/checkout@v4

      - name: Geode Modunu Derle
        uses: geode-sdk/build-geode-action@main
        with:
          target: ${{ matrix.config.target }}
          combine: true

  package:
    name: Package Mod
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Paketleri Birleştir
        uses: geode-sdk/build-geode-action/combine@main
