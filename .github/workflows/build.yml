name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: macOS
          os: macos-latest
        - name: Android32
          os: ubuntu-latest
          target: Android32
        - name: Android64
          os: ubuntu-latest
          target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      # Geode 4.x ile NDK 29 / Clang 21 uyumsiz (__synth3way hatasi), NDK 27 kullan
      - name: Pin Android NDK 27
        if: matrix.config.target == 'Android32' || matrix.config.target == 'Android64'
        run: |
          NDK27=$(ls -d /usr/local/lib/android/sdk/ndk/27* | sort | tail -n1)
          echo "Using $NDK27"
          echo "ANDROID_NDK_LATEST_HOME=$NDK27" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK27" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK27" >> $GITHUB_ENV

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
