name: Auto Build and Release

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    uses: geode-sdk/action/.github/workflows/build.yml@main

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-output

      - name: Update Latest Release Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Otomatik Mod Sürümü (Latest)"
          body: "Telefondan veya tarayıcıdan yapılan son değişikliklerle otomatik derlendi."
          files: build-output/**/*.geode
          prerelease: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
